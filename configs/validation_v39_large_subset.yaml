# V39 Scientific Validation: Large-Scale Subset (Available Data)
# Coverage: 219,331 targets (Subset of TESS available data)
# Reference: MASSIVE_VALIDATION_REPORT_JP.md
# Expected Completeness: 17.31%

validation:
  power_threshold: 7.1      # TESS Standard significance
  p_tol: 0.02              # 2% relative period error
  t0_tol: 0.5               # 0.5 days T0 error
  require_t0: true         # Require both period and transit-midpoint (phase) agreement.

expected:
  completeness: 0.1731
  mode: "large_subset_v39_require_t0"

catalogs:
  # Local cache paths for reliable validation
  toi_path: "data/catalogs/toi_latest.csv"
  eb_path: "data/catalogs/eb_latest.csv"
