# Vetting Pipeline Configuration V1
# Used for Step 2 (Refinement) and Step 3 (Vetting/Reporting)

refinement:
  snr_threshold: 5.0e10   # Candidates above this power are always refined
  top_n_targets: 100      # Top N targets by power are always refined
  random_sample_n: 10     # Randomly sample some targets for discovery
  
  # Heuristics for rescuing interesting but lower SNR signals
  planet_like:
    min_power: 1.0e9
    max_depth: 0.01       # 1% depth
    max_duration_frac: 0.1 # 10% of period

  # Search parameters for refinement
  top_k: 5                # How many candidates to keep per star in refinement
  n_periods: 10000        # Grid density for local re-search

scoring:
  snr_weight: 1.0
  snr_norm: 1.0e9         # Normalization factor for raw power (power / snr_norm = SNR)
  plausibility_weight: 1.0
  known_toi_bonus: 0.5
  known_eb_penalty: -0.8

catalogs:
  # Paths relative to project root
  toi_catalog: data/catalogs/toi_latest.csv
  eb_catalog: data/tess_eb_catalog.csv

reporting:
  top_n_plots: 100        # How many candidates to generate plots for
  out_dir: reports/sector1_vetting
