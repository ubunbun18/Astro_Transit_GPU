[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astrotransit-gpu"
version = "1.0.0"
description = "High-performance GPU-accelerated transit search platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "astropy",
    "lightkurve",
    "pandas",
    "scipy",
    "matplotlib",
    "pyyaml",
    "tabulate",
    "tqdm",
]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy"
]
benchmark = [
    "tabulate",
    "tqdm"
]

[project.scripts]
astrotransit-gpu = "astrotransit_gpu.cli:main"

[tool.pytest.ini_options]
markers = [
    "gpu: tests that require a CUDA-enabled GPU and CuPy",
    "slow: tests that take a long time to run"
]
